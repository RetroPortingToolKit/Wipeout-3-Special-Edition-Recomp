[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# SimVblankGate: framerate package forces gSimVblankSkip=2 on entry (AOT cadence).
mod_function_entry_funcs = ["0x800EDFC8"]

[runtime]
window_title = "Wipeout 3 Special Edition Recompiled"
memcard_dir = "saves"
# Record streamed/mod-patched code into overlay_captures.json and run it as
# native shards instead of the dirty-RAM interpreter. Required here: the
# framerate package patches the game's code on disc (target = "disc_user"),
# so none of it matches the AOT image built from the stock SCES_028.45 and
# it would otherwise interpret forever. See docs/COMPILING_OVERLAYS.md.
overlay_cache = true
# Background autocompile (gcc tier). Configuring this ALSO enables autocapture
# on interp pressure — required to capture the ntscfull8 enhancement code the
# game writes into the high 8 MB banks (0x781000+) and the runtime-dispatched
# interior PCs in mod-patched text; neither is seen by the passive CD-DMA
# capture path. The spawn itself runs on Windows only — on Linux/macOS run the
# same command by hand after a play session (docs/COMPILING_OVERLAYS.md §1).
overlay_autocompile_cmd = "python3 psxrecomp/tools/compile_overlays.py --captures build-release/overlay_captures.json --game-toml game.toml --recompiler build-recompiler/psxrecomp-game --runtime-include psxrecomp/runtime/include --out-dir build-release/cache --gcc /usr/bin/gcc --cps --jobs 8"

[video]
renderer = "opengl"
geometry_correction = true
# PGXP tuning, measured live at 8K internal on this title (2026-08-17).
# tolerance 0.5 rejected ~92k candidates per 4s and landed only ~28k
# dataflow hits; 1.0 takes rejections to ZERO and quadruples hits to ~112k.
# 2.0/4.0/8.0 are flat against 1.0, so 1.0 is the knee -- anything looser
# buys nothing and only widens what gets accepted.
pgxp_tolerance = 1.0
pgxp_cpu_mode = true
# PS1 affine texture mapping is very visible at high internal resolution.
perspective_texturing = true
# Authentic 4:3 is the baseline. The Widescreen mod below activates WipEout
# 3's game-specific native-wide hooks and chooses fixed/adaptive presentation.
aspect_ratio = "4:3"

[widescreen]
# Widescreen is game-owned on the Mods page, not a generic Display setting.
offer = false
offer_ultrawide = true
adaptive_view = true

# WipEout 3 is a 3D racer; keep BIOS/FMV/2D-only frames authored at 4:3 and
# engage wide gameplay presentation on GTE-active frames.
gte_game_mode = true
precise_nclip = true
native_wide = false

# Correct 4:3-authored HUD primitives for the live wide surface. Native-wide's
# expanded render target exposes WipEout 3's per-window clears as vertical bands,
# so keep this title on the legacy wide path and adjust the final HUD groups.
auto_ui_squash = true
nw_hud_corners = false
nw_flat_backdrop = false
nw_phase_backdrop = false

[widescreen.cull]
# WipEout 3's main-EXE screen reject funnels use 0x200/0x240 horizontal bounds
# paired with a 0x100 vertical bound. Widen only those qualified functions while
# a wide aspect is active; 4:3 behavior remains the original comparison.
auto_screen_x = true
screen_w_imms = ["0x200", "0x240"]
screen_h_imms = ["0x100"]
# Slack beyond the exact reveal before a primitive is trivially rejected.
# 16 put the reject edge essentially AT the revealed boundary (32:9 reveal is
# 267px, so the margin was 283), which still dropped primitives straddling it
# -- visible as occasional objects winking out at the extreme sides. 64 gives
# real slack; the cost is a little more submitted geometry, and the arena sits
# at 43% with the tightest pool at a third, so there is ample headroom.
guard_pixels = 64

# SceneryFrustumClip (0x80142634) clips in CAMERA space before RTPS squash
# (left/right: 2488*Z ± 25CC*X; top/bottom: 2480*Z ± 25CC*Y). That is the
# 4:3 knife-cut on trackside buildings. plane_nx on the 25CC/2480 loads widens
# it correctly, but every surviving poly advances the GPU packet cursor at
# 0x80198620 (+40B in the clipper alone). The stock arena has no headroom for
# the extra FOV, so the cursor overruns (start-grid ships snap backwards and
# freeze). Do NOT re-enable plane_nx until that arena is relocated/enlarged.
# Identity at 4:3 is not enough — wide must also be safe.
#
# Corrections (2026-08-16), from a full-EXE scan; the notes above predate them:
#  - The cursor is 0x80198620, not 0x801A8620. lui 0x801A + offset -31200 =
#    0x801A0000 - 0x79E0. The old address is referenced 0 times by the game.
#  - "stomps racer state" is UNVERIFIED. The arena is two 0x14000 halves at
#    0x801A5944/0x801B9944 ending 0x801CD944; overrunning half 0 runs into
#    half 1 (the list being DMA'd), and past half 1 sits a VRAM staging cursor
#    and render globals. No per-racer physics/AI array is adjacent either way.
#    That accounts for pop-in and visual damage, not for inverted steering.
#  - There are THREE unchecked cursors, not one. The tightest is 0x801E5668,
#    a hard 750-slot 40-byte pool (bumped at 0x801701B0); 0x801E5664 walks 190
#    32-byte slots. Guarding the 81920-byte arena alone would not be enough.
#  - Widescreen does not WIDEN the horizontal reject at these sites, it DISABLES
#    it: psx_ws_cull_keep_result consumes the margin as a boolean, so the
#    admitted geometry is unbounded rather than +33% of the frustum. No finite
#    arena enlargement is provably sufficient while that holds.
# RE-ENABLED 2026-08-17: the packet-overflow rationale above is disproved.
# Measured live, the arena peaks at 41.5% of 81920 B and the tightest pool at
# 247/750 across 4:3, 16:9 and 21:9 -- it never approaches capacity. The
# corruption blamed on overflow was the cull.keep PINS, now migrated to
# cull.widen. Screen-space widening cannot reach this clip: it runs in CAMERA
# space before RTPS, so raising x_margin (tested to 400) leaves the sides cut.
plane_nx_sites = ["0x80142664", "0x80142690"]

# Cohen-Sutherland outcode packers (post-squash SXY). These set bit0 RIGHT /
# bit1 LEFT, which the submitters AND-accumulate across a primitive's vertices
# and reject only when EVERY vertex is off the same edge -- a trivial reject,
# not a subdivision. They previously used [[widescreen.cull.keep]], which pins
# the verdict, i.e. deletes the horizontal trivial reject entirely and makes
# the game submit unbounded off-screen geometry. Widening moves the BOUND with
# the live reveal margin instead, so the reject stays honest and simply happens
# at the revealed edge. Identity at 4:3 (margin 0) in every mode.
#
# The paired VERTICAL compares and the NCLIP bltz are deliberately absent and
# stay vanilla -- only the horizontal field changes with aspect.
#
# REMOVED (2026-08-17): 28 further sites were listed here as cull.keep but are
# not screen-coordinate culls at all -- they compare GTE SZ depth against a
# near-Z constant (250 / 1700) held in s6, selecting a submitter path. Pinning
# those changed submitter selection for reasons unrelated to aspect, so they
# are back to vanilla. Encodings: 0x00D6302A, 0x0096202A, 0x00B6282A,
# 0x00F6382A, 0x0396282A, 0x03F6202A.

# LEFT edge: vanilla `sx < 0`; widened `sx < 0 - m`, so the reject line moves
# to more negative X and the revealed left margin is kept rather than voted
# off. rs holds SX (sign-extended by the preceding lh of the GTE SXY word).
[[widescreen.cull.widen]]
address  = "0x8017032C"
expected = "0x28850000"
mode     = "imm_lower"

