  "a7bb5cdafdf97ba1cd99cc832439f57ce0c39a8a",
]
known_crc32 = [
  "a0e9e5c2",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# PAL x2 is media-authenticated: selector 2 writes gSimVblankSkip=1 and the
# PAL-x2 state flag. The active package supplies the host CRTC/pacer hook; it
# does not approximate or rewrite the title patch.
mod_function_entry_funcs = ["0x800EDFC8"]

[runtime]
window_title = "Wipeout 3 Special Edition Recompiled"
# PAL x2/100 Hz is the release default for the authenticated PAL title. The
# runtime hook still arms only after the game programs PAL display mode.
memcard_dir = "saves"
openbios = false
bios_hle = true
# Runtime code is statically linked; no runtime compiler or overlay cache.
overlay_cache = false

[video]
renderer = "opengl"
# Hueponik's MAX-detail path requires the GooseStation-equivalent 900% CPU
# overclock; PAL x2 remains a separate CRTC/presentation setting.
cpu_overclock = 900
geometry_correction = true
perspective_texturing = true
pgxp_depth = true
pgxp_cpu_mode = true
supersampling = 4
hd_textures = true
bezel = "random"
auto_skip_fmv = true
# Gameplay starts wide; the Widescreen mod owns the fixed/adaptive choice and
# the runtime keeps BIOS/FMV/full-2D content on its authored 4:3 presentation.
aspect_ratio = "16:9"

[widescreen]
# Widescreen is game-owned on the Mods page, not a generic Display setting.
offer = true
offer_ultrawide = true
adaptive_view = true

# WipEout 3 is a 3D racer; keep BIOS/FMV/2D-only frames authored at 4:3 and
# engage wide gameplay presentation on GTE-active frames.
gte_game_mode = true
precise_nclip = true
native_wide = false

# Correct 4:3-authored HUD primitives for the live wide surface. Native-wide's
# expanded render target exposes WipEout 3's per-window clears as vertical bands,
# so keep this title on the legacy wide path and adjust the final HUD groups.
auto_ui_squash = true
nw_hud_corners = false
nw_flat_backdrop = false
nw_phase_backdrop = false

[widescreen.cull]
# WipEout 3's main-EXE screen reject funnels use 0x200/0x240 horizontal bounds
# paired with a 0x100 vertical bound. Widen only those qualified functions while
# a wide aspect is active; 4:3 behavior remains the original comparison.
auto_screen_x = true
screen_w_imms = ["0x200", "0x240"]
screen_h_imms = ["0x100"]
guard_pixels = 16

# SceneryFrustumClip (0x80142634) clips in CAMERA space before RTPS squash
# (left/right: 2488*Z ± 25CC*X; top/bottom: 2480*Z ± 25CC*Y). That is the
# 4:3 knife-cut on trackside buildings. plane_nx on the 25CC/2480 loads widens
# it correctly, but every surviving poly advances the GPU packet cursor at
# 0x801A8620 (+40B in the clipper alone). The stock arena has no headroom for
# the extra FOV, so the cursor stomps racer state (start-grid ships snap
# backwards and freeze). Do NOT re-enable plane_nx until that arena is
# relocated/enlarged. Identity at 4:3 is not enough — wide must also be safe.
# plane_nx_sites = ["0x80142664", "0x80142690"]  # DISABLED — packet overflow

# Packer LEFT/RIGHT keeps (post-squash SXY) are no-ops for extra FOV after
# squash maps 16:9 onto [0,width]; they stay identity at 4:3. Vertical packer
# tests and NCLIP bltz stay vanilla.

