[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# PAL x2 is media-authenticated: selector 2 writes gSimVblankSkip=1 and the
# PAL-x2 state flag. The active package supplies the host CRTC/pacer hook; it
# does not approximate or rewrite the title patch.
mod_function_entry_funcs = ["0x800EDFC8"]

# The type-4 billboard path omitted the GTE FLAG rejection used by its three
# siblings. Wide projection exposes its saturated +/-1024 rail coordinates as
# giant gray wedges, so mirror the sibling mask in otherwise dead/redundant
# instructions. This is title code, independent of PGXP rendering.
[[recompiler.patch]]
id = "billboard-type4-flag-cull-read"
address = "0x8013AD58"
expected = "0x00000000"
replacement = "0x484DF800"
note = "cfc2 t5,FLAG after the type-4 RTPS"

[[recompiler.patch]]
id = "billboard-type4-flag-cull-mask-hi"
address = "0x8013AD6C"
expected = "0x3C031F80"
replacement = "0x3C038046"
note = "lui v1,0x8046, matching the sibling reject mask"

[[recompiler.patch]]
id = "billboard-type4-flag-cull-and"
address = "0x8013AD70"
expected = "0x8C630010"
replacement = "0x01A36824"
note = "and t5,t5,v1; SZ3 is already live in t4"

[[recompiler.patch]]
id = "billboard-type4-flag-cull-test"
address = "0x8013AD74"
expected = "0x00000000"
replacement = "0x2DA30001"
note = "sltiu v1,t5,1; unchanged blez rejects masked GTE errors"

[runtime]
window_title = "Wipeout 3 Special Edition Recompiled"
# PAL x2/100 Hz is the release default for the authenticated PAL title. The
# runtime hook still arms only after the game programs PAL display mode.
memcard_dir = "saves"
openbios = false
bios_hle = true
# Runtime code is statically linked; no runtime compiler or overlay cache.
overlay_cache = false
# Proof-gated deadline-aware elision for guest polling loops. This is required
# for the PAL-100/900% profile: the title's timed wait uses a stack-local
# countdown, while device time and IRQ delivery remain cycle-exact.
idle_skip = true

[video]
renderer = "opengl"
# Start at a sane desktop-sized window so the GL drawable is created at the
# same dimensions as the presentation surface.  Leaving this unset lets the
# launcher reuse a stale tiny 426px state, which then produces giant black
# bands after the window is enlarged.
window_width = 1280
# Hueponik's MAX-detail path requires the GooseStation-equivalent 900% CPU
# overclock; PAL x2 remains a separate CRTC/presentation setting.
# Keep the verified 200% guest CPU setting. PAL100 pacing is provided by the
# framerate enhancement; the guest/display cadence remains independently
# limited to the authenticated 100 Hz PAL x2 mode.
cpu_overclock = 200
# PGXP is intentionally off for WipEout 3 SE. Its recovered geometry is
# visibly incorrect in races; retain the native GTE/GPU path until title-
# specific validation proves otherwise.
geometry_correction = false
perspective_texturing = false
pgxp_depth = false
pgxp_cpu_mode = false
supersampling = 4
hd_textures = true
bezel = "random"
auto_skip_fmv = true
# Gameplay starts wide; the Widescreen mod owns the fixed/adaptive choice and
# the runtime keeps BIOS/FMV/full-2D content on its authored 4:3 presentation.
aspect_ratio = "16:9"

[widescreen]
# Widescreen is game-owned on the Mods page, not a generic Display setting.
offer = true
offer_ultrawide = true
adaptive_view = true

# WipEout 3 is a 3D racer; keep BIOS/FMV/2D-only frames authored at 4:3 and
# engage wide gameplay presentation on GTE-active frames.
gte_game_mode = true
precise_nclip = true
native_wide = false

# Correct 4:3-authored HUD primitives for the live wide surface. Native-wide's
# expanded render target exposes WipEout 3's per-window clears as vertical bands,
# so keep this title on the legacy wide path and adjust the final HUD groups.
auto_ui_squash = true
nw_hud_corners = false
nw_flat_backdrop = false
nw_phase_backdrop = false

[widescreen.cull]
# WipEout 3's main-EXE screen reject funnels use 0x200/0x240 horizontal bounds
# paired with a 0x100 vertical bound. Widen only those qualified functions while
# a wide aspect is active; 4:3 behavior remains the original comparison.
auto_screen_x = true
screen_w_imms = ["0x200", "0x240"]
screen_h_imms = ["0x100"]
# The live 32:9 reveal is 267 px per side. A 16 px guard put the reject edge
# directly on straddling primitives; 64 px was measured with ample arena/pool
# headroom and stopped edge objects from winking out.
guard_pixels = 64
# These branches consume the validated sub-pixel NCLIP sign only while wide.
# Guest-visible MAC0 remains native, 4:3 remains bit-exact, and unlike the old
# keep hook this does not disable backface rejection.
nclip_exact_sites = [
    "0x801711FC",
    "0x80171DBC",
    "0x80171F40",
    "0x801720A0",
    "0x8017220C",
    "0x80172360",
    "0x801724AC",
    "0x801725DC",
    "0x80172720",
]

# SceneryFrustumClip (0x80142634) clips in CAMERA space before RTPS squash
# (left/right: 2488*Z ± 25CC*X; top/bottom: 2480*Z ± 25CC*Y). That is the
# 4:3 knife-cut on trackside buildings. Live measurements disproved the old
# overflow theory: the arena peaked at 41.5% and the tightest pool at 247/750
# across 4:3, 16:9, and 21:9. Scale only the horizontal plane component.
plane_nx_sites = ["0x80142664", "0x80142690"]

# Packer LEFT/RIGHT predicates classify trivial rejects after X squash.
# Move their bounds by the live reveal margin; do not pin their result. The 28
