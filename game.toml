# Fixed-selector PAL100 keeps the authenticated guest text image stock. All
# exact instruction replacements and all formula/scheduler blocks are trusted
# instruction-site callbacks. This prevents generated-AOT/RAM mismatches from
# arming the dirty-code interpreter while still rejecting non-stock words at
# each replacement callback.

# Hueponik's visual choices and the widescreen billboard guard are native
# instruction-site semantics. There are deliberately no generated AOT word
# replacements: authenticated guest RAM and generated text remain identical.

[runtime]
# Enables the translation/VRAM-patch layer (translations/*.toml). English
# game; the layer only applies the surgical data fixes shipped in-repo.
language = "en"
window_title = "Wipeout 3 Special Edition Recompiled"
memcard_dir = "saves"
  # Native title mods keep the authenticated stock executable byte-identical.
  # The title streams race code over this static address range; cache it as a
  # native overlay instead of interpreting it at 100 Hz.
  overlay_cache = true
  overlay_backend = "gcc"
  overlay_region_floor = "0x16F000"
  main_ram_mib = 8
  openbios = false
  idle_skip = true

# SIO1 serial link. WipEout 3 SE's 2/3/4P mode is its own libcomb "sio" driver
# on SIO1 (4P = 2 consoles x 2 splitscreen), so the link needs an actual peer on
# the wire. Without this the register file still responds and the game programs
# mode/ctrl/baud happily, but the backend stays "null" -- every byte it sends
# goes nowhere, ESTABLISH LINK times out, and both consoles wedge waiting.
#
# "crossover" cross-wires the two in-process machines (Stage B dual-console) and
# also requests them, so PSX_DUAL_CONSOLE=1 is no longer needed to get a pair.
# Env PSX_SIO1_BACKEND / PSX_SIO1_LATENCY override this for A/B.
# enabled=false: the crossover peer request activates DUAL CONSOLE -- two full
# PSX machines on one core. Shipping that on meant every stock launch (menus,
# FMV, single player) ran at half speed or worse (~17 fps measured). Link play
# opts in with PSX_DUAL_CONSOLE=1 (or flip this to true for a link session).
[runtime.link]
enabled = false
backend = "crossover"
latency_cycles = 0

[video]
renderer = "opengl"
# Match the reference build: render internally at 4x, then fit the window to
# the active desktop (a 4K desktop therefore presents at 4K without hardcoding
# one monitor mode or forcing exclusive fullscreen). Leaving window_width
# unset selects the runtime's fit-to-display behavior.
supersampling = 4
# Late swaps present immediately (tear) instead of stalling a full refresh —
# removes the heavy-sim-vblank judder on the 30fps-sim variants. Driver
# fallback to full vsync if EXT_swap_control_tear is unsupported.
vsync = "adaptive"
# Keep visual PGXP consumers off; exact NCLIP uses only validated internal
# shadow coordinates and never alters guest-visible GTE state.
geometry_correction = false
# PGXP tuning, measured live at 8K internal on this title (2026-08-17).
# tolerance 0.5 rejected ~92k candidates per 4s and landed only ~28k
# dataflow hits; 1.0 takes rejections to ZERO and quadruples hits to ~112k.
# 2.0/4.0/8.0 are flat against 1.0, so 1.0 is the knee -- anything looser
# buys nothing and only widens what gets accepted.
pgxp_tolerance = 1.0
# false: the PGXP shadow engine is a per-instruction tax (psx_pgxp_alu at ~2%
# of a stock FMV run) and correction is off by default anyway -- run the engine
# only when someone actually enables the feature (launcher PGXP mod / settings).
pgxp_cpu_mode = false
# Depth-test polygons on PGXP's recovered per-vertex Z instead of relying
# solely on the PS1 ordering table, whose one-bucket-per-primitive sort
# cannot resolve intersecting or interpenetrating geometry.
#
# Depth comes from the ABSOLUTE GTE screen Z, mapped reciprocally
# (1 - 2*zn/z) rather than linearly: a linear map has to clamp past a chosen
# far value and everything beyond collapses onto one plane, which is most of
# a race track. Verified against two savestates at 6x internal: the ship
# renders intact where the earlier linear mapping chopped its fuselage apart.
# DEFAULT OFF pending a fix: static frames verify correctly, but in MOTION
# the track drops out and the ship clips through the floor. A per-frame
# depth clear that does not actually run every frame would do exactly that,
# and a savestate A/B cannot see it because the defect needs sustained
# gameplay to show up. Flip to true to test: pgxp_depth on=1 over the wire.
pgxp_depth = false

# Disabled with the rest of visual PGXP pending title-specific motion proof.
perspective_texturing = false
# Beetle PSX HW-format HD texture pack from
# <disc dir>/<disc stem>-texture-replacements/. princepeter64's Wip3out pack is
# drop-in: tex_pack.h matches Beetle's hashing exactly (same CRC32 polynomial,
# same hashed byte range, same UV-limited sample rect), and its 292 entries
# index and decode cleanly — 79 of them matched real draws in a single race
# with zero decode failures.
#
# Substitution is implemented and on. All 20 known font texture/palette keys
# are active, including both Helvetica atlas sizes and their palette variants.
# The pack-local exclude.txt is deliberately empty: excluding an atlas makes
# every glyph using that texture hash fall back to the original bitmap.
hd_textures = true
# The pack (and the HD FONT — the F500 atlases are pack entries) lives in the
# repo disc/ folder, NOT beside whatever cue is loaded. Without this, launching
# from any other disc path silently loads a 0-entry pack: textures AND fonts
# revert to low-res at once. That is exactly what happened.
hd_texture_dir = "hd_textures"

# CPU budget, percent of stock. Direct PAL100 no longer executes Hueponik's
# high-RAM replacement engine. 250% preserves enough host/audio headroom for a
# saturated 100 Hz ultrawide race: renderer-native HUD proof measures 1.00278x
# wall speed at 21:9 with SPU/CDDA at 44.1 kHz and zero underruns. 300% reaches
# correct HUD time but underruns at wide aspects; 400% also runs the dense race
# start slow despite nominal title timing.
cpu_overclock = 250
# PAL100's activation plugin owns both CRTC x2 and native 100 Hz pacing. A
# disabled PAL100 feature therefore leaves the machine at stock PAL cadence.
# Startup logos are skipped by the title-specific five-callsite intro feature;
# later FMVs remain enabled so their real-time cadence can be verified.

# Margin artwork is game-owned on the Mods page (Bezel Artwork), not a config
# knob -- same move as Widescreen below. Left "off" so the package owns the
# setting outright: the plugin writes the player's team choice at activation,
# and a disabled package leaves this value standing, which is the off state.
# A team name ("qirex"), "random", or a path still works here if you want the
# artwork without the mod, but the Mods page will override it when enabled.
# Logos by toolboxio (deviantart.com/toolboxio), via awesome-wipeout.github.io.
bezel = "off"

# Authentic 4:3 is the baseline. The Widescreen mod below activates WipEout
# 3's game-specific native-wide hooks and chooses fixed/adaptive presentation.
aspect_ratio = "4:3"

[widescreen]
# Widescreen is game-owned on the Mods page, not a generic Display setting.
offer = false
offer_ultrawide = true
adaptive_view = true
# Fill the pillarbox margins of a 4:3-pinned present (2D menus, title, FMV-less
# full-2D screens) with the frame's own edge columns instead of black. Opt-in
# per title since it smears any content whose edge columns carry picture; kept
# ON here — this is WipEout 3's authored look on very wide displays.
menu_edge_fill = true

# WipEout 3 is a 3D racer; keep BIOS/FMV/2D-only frames authored at 4:3 and
# engage wide gameplay presentation on GTE-active frames.
gte_game_mode = true
precise_nclip = true
native_wide = false

# Correct 4:3-authored HUD primitives for the live wide surface. Native-wide's
# expanded render target exposes WipEout 3's per-window clears as vertical bands,
# so keep this title on the legacy wide path and adjust the final HUD groups.
auto_ui_squash = true
nw_hud_corners = false
nw_flat_backdrop = false
nw_phase_backdrop = false

[widescreen.cull]
# WipEout 3's main-EXE screen reject funnels use 0x200/0x240 horizontal bounds
# paired with a 0x100 vertical bound. Widen only those qualified functions while
# a wide aspect is active; 4:3 behavior remains the original comparison.
auto_screen_x = true
screen_w_imms = ["0x200", "0x240"]
screen_h_imms = ["0x100"]
# Slack beyond the exact reveal before a primitive is trivially rejected.
# 16 put the reject edge essentially AT the revealed boundary (32:9 reveal is
# 267px, so the margin was 283), which still dropped primitives straddling it
# -- visible as occasional objects winking out at the extreme sides. 64 gives
# real slack; the cost is a little more submitted geometry, and the arena sits
# at 43% with the tightest pool at a third, so there is ample headroom.
guard_pixels = 64

# SceneryFrustumClip (0x80142634) clips in CAMERA space before RTPS squash
# (left/right: 2488*Z ± 25CC*X; top/bottom: 2480*Z ± 25CC*Y). That is the
# 4:3 knife-cut on trackside buildings. plane_nx on the 25CC/2480 loads widens
# it correctly, but every surviving poly advances the GPU packet cursor at
# 0x80198620 (+40B in the clipper alone). The stock arena has no headroom for
# the extra FOV, so the cursor overruns (start-grid ships snap backwards and
# freeze). Do NOT re-enable plane_nx until that arena is relocated/enlarged.
# Identity at 4:3 is not enough — wide must also be safe.
#
# Corrections (2026-08-16), from a full-EXE scan; the notes above predate them:
#  - The cursor is 0x80198620, not 0x801A8620. lui 0x801A + offset -31200 =
#    0x801A0000 - 0x79E0. The old address is referenced 0 times by the game.
#  - "stomps racer state" is UNVERIFIED. The arena is two 0x14000 halves at
#    0x801A5944/0x801B9944 ending 0x801CD944; overrunning half 0 runs into
#    half 1 (the list being DMA'd), and past half 1 sits a VRAM staging cursor
#    and render globals. No per-racer physics/AI array is adjacent either way.
#    That accounts for pop-in and visual damage, not for inverted steering.
#  - There are THREE unchecked cursors, not one. The tightest is 0x801E5668,
#    a hard 750-slot 40-byte pool (bumped at 0x801701B0); 0x801E5664 walks 190
#    32-byte slots. Guarding the 81920-byte arena alone would not be enough.
#  - Widescreen does not WIDEN the horizontal reject at these sites, it DISABLES
#    it: psx_ws_cull_keep_result consumes the margin as a boolean, so the
#    admitted geometry is unbounded rather than +33% of the frustum. No finite
#    arena enlargement is provably sufficient while that holds.
# RE-ENABLED 2026-08-17: the packet-overflow rationale above is disproved.
# Measured live, the arena peaks at 41.5% of 81920 B and the tightest pool at
# 247/750 across 4:3, 16:9 and 21:9 -- it never approaches capacity. The
# corruption blamed on overflow was the cull.keep PINS, now migrated to
# cull.widen. Screen-space widening cannot reach this clip: it runs in CAMERA
# space before RTPS, so raising x_margin (tested to 400) leaves the sides cut.
plane_nx_sites = ["0x80142664", "0x80142690"]

# These branches consume the validated sub-pixel NCLIP sign only while wide.
# Guest-visible MAC0 remains native and 4:3 remains bit-exact.
nclip_exact_sites = [
    "0x801711FC",
    "0x80171DBC",
    "0x80171F40",
    "0x801720A0",
    "0x8017220C",
    "0x80172360",
    "0x801724AC",
    "0x801725DC",
    "0x80172720",
]

# Cohen-Sutherland outcode packers (post-squash SXY). These set bit0 RIGHT /
# bit1 LEFT, which the submitters AND-accumulate across a primitive's vertices
# and reject only when EVERY vertex is off the same edge -- a trivial reject,
# not a subdivision. They previously used [[widescreen.cull.keep]], which pins
# the verdict, i.e. deletes the horizontal trivial reject entirely and makes
# the game submit unbounded off-screen geometry. Widening moves the BOUND with
# the live reveal margin instead, so the reject stays honest and simply happens
# at the revealed edge. Identity at 4:3 (margin 0) in every mode.
#
# The paired VERTICAL compares and the NCLIP bltz are deliberately absent and
# stay vanilla -- only the horizontal field changes with aspect.
#
# REMOVED (2026-08-17): 28 further sites were listed here as cull.keep but are
# not screen-coordinate culls at all -- they compare GTE SZ depth against a
# near-Z constant (250 / 1700) held in s6, selecting a submitter path. Pinning
# those changed submitter selection for reasons unrelated to aspect, so they
# are back to vanilla. Encodings: 0x00D6302A, 0x0096202A, 0x00B6282A,
# 0x00F6382A, 0x0396282A, 0x03F6202A.

# LEFT edge: vanilla `sx < 0`; widened `sx < 0 - m`, so the reject line moves
# to more negative X and the revealed left margin is kept rather than voted
