idle_skip = true
# Streamed race/replay code is precompiled into the adjacent native overlay
# cache. Without this gate the runtime silently interprets those RAM regions
# even when fully built x64 shards are present.
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"
cpu_overclock = 900
pal_video_clock_multiplier = 2

[controller]
