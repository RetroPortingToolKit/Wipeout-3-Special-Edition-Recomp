[netplay]
require_cue = true
required_tracks = 14
required_disc_fp = "a8a369bf31c63906bfcf91d1a0a87d93bde7984d82f02edc5e79727d1e325339"

# 8 MB framerate mod (ntscfull8): the enhancement engine at 0x80780000+ is a
# detour trampoline farm — patched text sites `j 0x8078xxxx` into stubs that
# jump straight back. Detour labels are not callable-function boundaries, so
# runtime dispatch evidence alone cannot seed them (OBSERVED_PC_ONLY); declare
# them so compile_overlays.py roots each stub (TOML_DECLARED_ENTRY) and the
# region compiles native instead of interpreting forever. Entries were
