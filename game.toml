# Autofilled by tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.

[game]
name = "Wipeout 3 Special Edition"
id = "SCES-02845"
players = 2
exe = "disc/SCES_028.45"
disc = "disc/WipEout 3 - Special Edition (Europe) (En,Fr,De,Es,It).cue"
load_address = "0x80010000"
entry_pc = "0x80162474"
text_size = "0x0016C000"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "WipEout 3 - Special Edition (Europe) (En,Fr,De,Es,It) (Track 01).bin"
cue_name = "WipEout 3 - Special Edition (Europe) (En,Fr,De,Es,It).cue"
boot_exe = "SCES_028.45"
known_sizes = [94660944]
