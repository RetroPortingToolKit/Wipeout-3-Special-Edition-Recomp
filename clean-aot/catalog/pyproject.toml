[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "psxrecomp-clean-aot-catalog"
version = "0.1.0"
description = "Deterministic offline catalog for precompiled PSX executable regions"
requires-python = ">=3.10"

[project.scripts]
psx-catalog = "psx_catalog.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["psx_catalog*"]
