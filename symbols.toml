# Wipeout 3 Special Edition — progressive symbol map (partial decomp)
# Discover → label here → manipulate via PSX_FN_* (tools/sync_symbols.py).
# Gate emit=true only when the entry is safe to own for AOT / host hooks.
# Use [[block]] for internal control-flow labels that are not ABI-callable;
# sync_symbols intentionally emits only [[func]] entries into psx_symbols.h.
# See psxrecomp/docs/SYMBOLS.md.

