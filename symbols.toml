# Wipeout 3 Special Edition — progressive symbol map (partial decomp)
# Discover → label here → manipulate via PSX_FN_* (tools/sync_symbols.py).
# Gate emit=true only when the entry is safe to own for AOT / host hooks.
# Use [[block]] for internal control-flow labels that are not ABI-callable;
# sync_symbols intentionally emits only [[func]] entries into psx_symbols.h.
# See psxrecomp/docs/SYMBOLS.md.

[[func]]
pc = 0x80162474
name = "PsxExeEntryTrampoline"
emit = false
status = "confirmed"
note = "Exact PS-X EXE header entry; two-instruction non-returning trampoline to the expansion-RAM startup loader at 0x800D03B8, not the CRT initialization body"

[[func]]
pc = 0x80116128
name = "RunRaceSession"
emit = false
status = "known"
note = "Sole-called non-returning race-session owner: initialize race/render/audio state, then run the closed per-frame simulation/view/render loop containing the only call to RenderRaceFrame"

[[func]]
pc = 0x8016FC28
