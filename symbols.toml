[[func]]
pc = 0x8016FEFC
name = "SubmitTexturedQuadFirstEdgeFan"
emit = false
status = "known"
note = "Address-taken renderer-private sibling of 0x8016FD34: reject a common-outcode quad, use the shared near clipper below depth 125, or midpoint-project the first input edge and OT-link three consecutive 32-byte textured-triangle packets"

[[func]]
pc = 0x8016F94C
name = "ProjectAndSubmitPackedFaceGroups"
emit = false
status = "known"
note = "Renderer-private tail target of 0x8016FC28: for 1..8 consecutive 64-byte face records, project packed vertex pairs through 0x80170254, reject a shared-outcode group, then invoke the scratchpad-selected primitive callback for each 24-byte subrecord and preserve the updated renderer cursors"

[[func]]
pc = 0x8016FA70
name = "SubdivideAndSubmitPackedFaceStrip"
emit = false
status = "known"
note = "Renderer-private callback selected by packed-face modes 2, 4, and 5: expand each consecutive 64-byte face record into a projected strip of adjacent vertex pairs, trivial-reject it, split every pair-to-pair quad into four children, and submit those children through the two scratchpad-selected primitive callbacks"

[[func]]
pc = 0x80170774
name = "SubdivideTwiceAndSubmitPackedFaceStrip"
emit = false
status = "known"
note = "Renderer-private tail target selected only by packed-face mode 3: project each adjacent-pair quad, perform two midpoint/center subdivision levels, and submit up to sixteen leaf quads through the scratchpad-selected callbacks"

[[func]]
pc = 0x801700C4
