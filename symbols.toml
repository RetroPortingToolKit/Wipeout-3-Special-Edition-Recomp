emit = false
status = "known"
note = "Single-caller tail dispatcher: decode a packed face descriptor into a low-10-bit face index, a 1..8 downstream count, and an 8-way renderer/helper-table selection; publish four private callbacks in scratchpad and tail-jump to the selected primitive renderer without emitting a GPU packet itself"

[[func]]
