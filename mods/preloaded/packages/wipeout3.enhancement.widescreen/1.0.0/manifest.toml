format_version = 5
id = "wipeout3.enhancement.widescreen"
version = "1.0.0"
name = "WipEout 3 Widescreen"
author = "mstan"
description = "Renders WipEout 3 Special Edition gameplay with adaptive native-wide projection, HUD correction, and cull widening."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "*"

[[feature]]
id = "widescreen"
name = "Widescreen (Experimental)"
description = "Enable WipEout 3's experimental widescreen rendering and choose a fixed or resize-driven aspect."
group = "Display"
default_enabled = true

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect ratio"
description = "Adaptive follows the live window size from 4:3 through 21:9."
group = "Display"
type = "choice"
default = "adaptive"

[[option.choice]]
value = "4:3"
label = "4:3 (original)"

[[option.choice]]
value = "16:9"
label = "16:9"

[[option.choice]]
value = "21:9"
label = "21:9"

[[option.choice]]
value = "32:9"
label = "32:9 (super-ultrawide)"

[[option.choice]]
value = "adaptive"
label = "Adaptive"

[[plugin]]
feature = "widescreen"
id = "wipeout3.widescreen.4-3"
when = { aspect = "4:3" }

[[plugin]]
feature = "widescreen"
id = "wipeout3.widescreen.16-9"
when = { aspect = "16:9" }

[[plugin]]
feature = "widescreen"
id = "wipeout3.widescreen.21-9"
when = { aspect = "21:9" }

[[plugin]]
feature = "widescreen"
id = "wipeout3.widescreen.32-9"
when = { aspect = "32:9" }

[[plugin]]
feature = "widescreen"
id = "wipeout3.widescreen.adaptive"
when = { aspect = "adaptive" }

[[plugin]]
feature = "widescreen"
id = "wipeout3.widescreen.billboard-type4-cull"
