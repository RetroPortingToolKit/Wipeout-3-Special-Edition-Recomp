format_version = 7
id = "wipeout3.enhancement.framerate"
version = "1.3.0"
name = "WipEout 3 NTSC Mode"
author = "hueponik"
description = "Converted from hueponik's SCES-02845 xdelta patches: his plain NTSC build (60 Hz, stock 2 MB RAM), which he recommends for an unmodified PlayStation (30 fps instead of 25). Measured here: races hold 30 fps (stock 25) at normal game speed."
license = "See upstream patch author. Conversion is a sparse native overlay of that work."
source_name = "hueponik/wip3out-patches"
