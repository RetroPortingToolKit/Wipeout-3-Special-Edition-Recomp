format_version = 5
id = "wipeout3.enhancement.framerate"
version = "1.1.0"
name = "WipEout 3 NTSC / PAL Mode"
author = "hueponik"
description = "Converted from hueponik's SCES-02845 xdelta patches. NTSC runs the game in the 60 Hz NTSC video mode with hueponik's 50-to-60 Hz timing scales, racing at about 30 frames per second as on an NTSC console; PAL keeps the 50 Hz mode at about 25. Extras Enhanced and Full are hueponik's 8 MB builds: they need 8 MB Main RAM, and 8 MB Main RAM should stay off with Extras None."
license = "See upstream patch author. Conversion is a sparse native overlay of that work."
source_name = "hueponik/wip3out-patches"
source_url = "https://codeberg.org/hueponik/wip3out-patches"
resolver = "declarative"
save_compatibility = "isolated"

[[author_link]]
name = "hueponik"
url = "https://codeberg.org/hueponik/wip3out-patches"

[[target]]
game_id = "SCES-02845"
disc_sha256 = "003bdc41068252e791ea7dd99ba1b94814dc48b967e57a7cdc4bf6e1cf4cb1e9"
exe_sha256 = "0213f5292fa1d995ebe61f42d5dbdb6614e481cb3840ac5f1521c2dfdccc0a4d"

[[feature]]
id = "framerate"
name = "NTSC / PAL Mode"
description = """hueponik's region conversion: NTSC (60 Hz video, about 30 frames per second in a race) or PAL (50 Hz, about 25). Extras Enhanced and Full need 8 MB Main RAM; leave 8 MB Main RAM off with Extras None. Pairs with Frame Blending to present those frames at your display rate."""
group = "Gameplay"
default_enabled = false

[[plugin]]
feature = "framerate"
id = "wipeout3.framerate.skip2-on"

[[plugin]]
feature = "framerate"
id = "wipeout3.framerate.skip2"

[[plugin]]
feature = "framerate"
id = "wipeout3.framerate.skip2-entry"

[[option]]
feature = "framerate"
id = "region"
label = "Region"
description = "NTSC: 60 Hz video, about 30 frames per second in a race. PAL: 50 Hz, about 25."
group = "Gameplay"
type = "choice"
default = "ntsc"

[[option.choice]]
value = "ntsc"
label = "NTSC (60 Hz)"

[[option.choice]]
value = "pal"
label = "PAL (50 Hz)"

[[option]]
feature = "framerate"
id = "extras"
label = "Extras"
description = "hueponik's 8 MB builds. Enhanced and Full need 8 MB Main RAM; None is the stock 2 MB game and should run with 8 MB Main RAM off."
group = "Gameplay"
type = "choice"
default = "none"

[[option.choice]]
value = "none"
label = "None (stock 2 MB)"

[[option.choice]]
value = "enhanced"
label = "Enhanced (needs 8 MB Main RAM)"

[[option.choice]]
value = "full"
label = "Full (needs 8 MB Main RAM)"

